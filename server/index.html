<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金庸群俠傳</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0b0d; color: #e8e8ea;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100vh; padding: 18px 12px 28px;
  }
  #app {
    display: flex; gap: 18px; align-items: flex-start; justify-content: center;
  }
  #main {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; min-width: 0;
  }
  #side {
    width: 300px; flex: none; align-self: stretch;
    display: flex; flex-direction: column;
    border: 1px solid #26262c; border-radius: 5px; background: #101014;
    max-height: calc(100vh - 46px);
  }
  #side h2 {
    margin: 0; padding: 10px 12px 8px; font-size: 11px; font-weight: 600;
    letter-spacing: .12em; color: #c9c9cf; border-bottom: 1px solid #1e1e24;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  #side h2 em { font-style: normal; color: #5b5b66; font-size: 10px; letter-spacing: 0; }
  #logrows { overflow-y: auto; padding: 6px 0 10px; flex: 1; }
  .r { display: flex; gap: 7px; padding: 2px 12px; font-size: 11px; line-height: 1.5; white-space: nowrap; }
  .r:hover { background: #17171c; }
  .r .ts { color: #4a4a55; }
  .r .src { width: 26px; flex: none; }
  .r .src.api { color: #7aa2f7; }
  .r .src.web { color: #7c7c8a; }
  .r .vb { font-weight: 700; }
  .r .tg { color: #d8d8de; overflow: hidden; text-overflow: ellipsis; }
  .v-KEY, .v-KEYS, .v-TEXT { color: #6cb6ff; }
  .v-WAIT { color: #8a8a96; }
  .v-GET  { color: #7ec699; }
  #empty { color: #55555f; font-size: 11px; padding: 10px 12px; }
  @media (max-width: 900px) {
    #app { flex-direction: column; align-items: center; }
    #side { width: min(100%, 620px); max-height: 300px; }
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .12em; color: #c9c9cf; }
  #wrap { position: relative; line-height: 0; }
  canvas {
    image-rendering: pixelated;
    background: #000;
    border: 1px solid #26262c;
    border-radius: 3px;
    max-width: 100%;
    height: auto;
    display: block;
  }
  #veil {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: #000c; font-size: 12px; letter-spacing: .1em; border-radius: 3px;
  }
  #veil.gone { display: none; }
  #pad { display: grid; grid-template-columns: repeat(3, 46px); gap: 6px; }
  #pad [data-k=up]    { grid-area: 1 / 2; }
  #pad [data-k=left]  { grid-area: 2 / 1; }
  #pad [data-k=down]  { grid-area: 2 / 2; }
  #pad [data-k=right] { grid-area: 2 / 3; }
  button {
    background: #17171b; color: #d8d8dd; border: 1px solid #2e2e36;
    border-radius: 5px; padding: 9px 0; font: inherit; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  button:active { background: #2a2a33; border-color: #4a4a58; }
  #keys { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 380px; }
  #keys button { padding: 9px 13px; }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  #hud { color: #6c6c78; font-size: 11px; letter-spacing: .04em; text-align: center; }
  kbd {
    background: #1c1c22; border: 1px solid #33333d; border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 5px; font-size: 11px; color: #b9b9c2;
  }
  details {
    width: min(100%, 900px); border: 1px solid #26262c; border-radius: 5px;
    background: #101014;
  }
  summary {
    cursor: pointer; padding: 11px 14px; color: #c9c9cf; font-size: 12px;
    letter-spacing: .05em; list-style: none; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
  }
  summary::-webkit-details-marker { display: none; }
  summary span.hint { color: #6c6c78; font-size: 11px; letter-spacing: 0; }
  #promptbox { padding: 0 14px 14px; }
  #prompt {
    width: 100%; height: 260px; resize: vertical;
    background: #08080a; color: #b6b6bf; border: 1px solid #26262c;
    border-radius: 4px; padding: 10px; font: 11px/1.55 ui-monospace, Menlo, monospace;
    white-space: pre; overflow: auto;
  }
  #promptbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #copied { color: #64b47a; font-size: 11px; opacity: 0; transition: opacity .2s; }
  #copied.on { opacity: 1; }
</style>

<div id="app">
<div id="main">
<h1>金庸群俠傳</h1>

<div id="wrap">
  <canvas id="screen" width="320" height="200"></canvas>
  <div id="veil">connecting…</div>
</div>

<div class="row">
  <div id="pad">
    <button data-k="up">↑</button>
    <button data-k="left">←</button>
    <button data-k="down">↓</button>
    <button data-k="right">→</button>
  </div>
  <div id="keys">
    <button data-k="enter">Enter 確定</button>
    <button data-k="space">Space</button>
    <button data-k="esc">Esc 選單</button>
    <button data-k="y">Y</button>
    <button data-k="n">N</button>
  </div>
</div>

<details>
  <summary>
    <b>Let your own LLM play this</b>
    <span class="hint">copy the prompt into your model's system prompt, no harness of ours needed</span>
  </summary>
  <div id="promptbox">
    <textarea id="prompt" readonly spellcheck="false">loading…</textarea>
    <div id="promptbar">
      <button id="copy">Copy prompt</button>
      <button id="open">Open as text</button>
      <span id="copied">copied</span>
    </div>
  </div>
</details>

<div id="hud">
  click the screen, then use <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
  <kbd>Enter</kbd> <kbd>Esc</kbd> <kbd>Y</kbd> <kbd>N</kbd>
  <span id="stat"></span>
</div>
</div>

<aside id="side">
  <h2>ACTIVITY <em id="logcount"></em></h2>
  <div id="logrows"><div id="empty">nothing yet. keys you press here, and calls
    to /api/*, both show up.</div></div>
</aside>
</div>

<script>
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d", { alpha: false });
const veil = document.getElementById("veil");
const stat = document.getElementById("stat");
let sock, tileImg = null, got = 0, bytes = 0;

function fit() {
  // integer-scale the 320x200 picture to whatever the viewport allows
  const k = Math.max(1, Math.min(Math.floor((window.innerWidth - 40) / cv.width),
                                 Math.floor((window.innerHeight - 260) / cv.height)));
  cv.style.width = cv.width * k + "px";
}
addEventListener("resize", fit);

async function inflate(buf) {
  const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

async function onFrame(raw) {
  const d = await inflate(raw);
  const dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
  const w = dv.getUint16(1, true), h = dv.getUint16(3, true);
  const tw = d[5], th = d[6];
  const cols = dv.getUint16(7, true);
  const count = dv.getUint16(11, true);

  if (cv.width !== w || cv.height !== h) {
    cv.width = w; cv.height = h; fit();
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
  }
  if (!tileImg || tileImg.width !== tw || tileImg.height !== th) {
    tileImg = ctx.createImageData(tw, th);
  }

  const idxOff = 13, dataOff = idxOff + count * 2, tileLen = tw * th * 3;
  const px = tileImg.data;
  for (let i = 0; i < count; i++) {
    const t = dv.getUint16(idxOff + i * 2, true);
    let s = dataOff + i * tileLen;
    for (let p = 0; p < tw * th; p++) {
      px[p * 4] = d[s++]; px[p * 4 + 1] = d[s++]; px[p * 4 + 2] = d[s++]; px[p * 4 + 3] = 255;
    }
    ctx.putImageData(tileImg, (t % cols) * tw, Math.floor(t / cols) * th);
  }
  got++; bytes += raw.byteLength;
  stat.textContent = ` · ${w}×${h} · ${count} tiles, ${(raw.byteLength / 1024).toFixed(1)} KB`
                   + ` · ${(bytes / 1024).toFixed(0)} KB total`;
  veil.classList.add("gone");
}

function connect() {
  sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  sock.binaryType = "arraybuffer";
  sock.onmessage = e => {
    if (typeof e.data === "string") {
      const m = JSON.parse(e.data);
      if (m.t === "log") m.e.forEach(addLog);
    } else {
      onFrame(e.data);
    }
  };
  sock.onopen = () => veil.textContent = "waiting for the first frame…";
  sock.onclose = () => {
    veil.textContent = "disconnected, retrying…";
    veil.classList.remove("gone");
    setTimeout(connect, 1500);
  };
}

const rows = document.getElementById("logrows");
const empty = document.getElementById("empty");
const logcount = document.getElementById("logcount");
let logged = 0, lastId = 0;

function addLog(e) {
  if (e.id <= lastId) return;             // reconnects resend recent backlog
  lastId = e.id;
  empty?.remove();
  const d = new Date(e.at * 1000);
  const ts = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, "0")).join(":");
  const row = document.createElement("div");
  row.className = "r";
  row.innerHTML =
    `<span class="ts"></span><span class="src"></span>` +
    `<span class="vb"></span><span class="tg"></span>`;
  row.children[0].textContent = ts;
  row.children[1].textContent = e.src;
  row.children[1].classList.add(e.src);
  row.children[2].textContent = e.verb;
  row.children[2].classList.add("v-" + e.verb);
  row.children[3].textContent = e.target + (e.detail ? " " + e.detail : "");
  if (!e.ok) row.style.color = "#ff6b6b";
  const stuck = rows.scrollTop + rows.clientHeight >= rows.scrollHeight - 30;
  rows.appendChild(row);
  while (rows.children.length > 300) rows.firstChild.remove();
  if (stuck) rows.scrollTop = rows.scrollHeight;
  logcount.textContent = ++logged;
}

const send = o => sock?.readyState === 1 && sock.send(JSON.stringify(o));

const MAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  Enter: "enter", Escape: "esc", " ": "space", Backspace: "backspace", Tab: "tab",
};
const held = new Set();
addEventListener("keydown", e => {
  const k = MAP[e.key] || (e.key.length === 1 ? e.key.toLowerCase() : null);
  if (!k) return;
  e.preventDefault();
  if (held.has(k)) return;          // ignore auto-repeat, the game does its own
  held.add(k);
  send({ t: "key", k, down: true });
});
addEventListener("keyup", e => {
  const k = MAP[e.key] || (e.key.length === 1 ? e.key.toLowerCase() : null);
  if (!k) return;
  e.preventDefault();
  held.delete(k);
  send({ t: "key", k, down: false });
});

for (const b of document.querySelectorAll("button[data-k]")) {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); send({ t: "key", k, down: true }); };
  const up = e => { e.preventDefault(); send({ t: "key", k, down: false }); };
  b.addEventListener("pointerdown", down);
  b.addEventListener("pointerup", up);
  b.addEventListener("pointerleave", up);
  b.addEventListener("pointercancel", up);
}

cv.addEventListener("click", () => cv.focus());

// The prompt is generated server-side so the endpoints carry this exact host.
const promptEl = document.getElementById("prompt");
fetch("/api/help").then(r => r.text()).then(t => promptEl.value = t)
  .catch(() => promptEl.value = "could not load /api/help");
document.getElementById("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(promptEl.value);
  } catch {
    promptEl.select();                    // clipboard API needs https or localhost
    document.execCommand("copy");
  }
  const c = document.getElementById("copied");
  c.classList.add("on");
  setTimeout(() => c.classList.remove("on"), 1400);
};
document.getElementById("open").onclick = () => window.open("/api/help", "_blank");

fit();
connect();
</script>
