<!doctype html>
<meta charset="utf-8">
<title>jy-crpg-bench runs</title>
<style>
  :root {
    --bg: #0e0f13; --card: #16181f; --line: #262a35;
    --ink: #d8dce6; --dim: #7b8394; --hot: #8ecdf7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5
         ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif; }
  header { padding: 22px 26px 14px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  #live { color: var(--dim); font-size: 13px; }
  .bar { padding: 12px 26px; display: flex; gap: 8px; align-items: center;
         flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .bar label { color: var(--dim); font-size: 12px; }
  select, .seg button { background: var(--card); color: var(--ink); font: inherit;
          font-size: 13px; border: 1px solid var(--line); border-radius: 6px;
          padding: 5px 9px; }
  .seg { display: flex; gap: 0; }
  .seg button { cursor: pointer; border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: #24303c; color: var(--hot);
          border-color: #3c5064; position: relative; z-index: 1; }
  main { padding: 20px 26px 60px; }

  /* grid */
  .grid { display: grid; gap: 18px;
          grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; }
  .card video { width: 100%; display: block; background: #000;
                image-rendering: pixelated; aspect-ratio: 320/232; }
  .card .meta { padding: 11px 13px 13px; }
  .who { font-weight: 600; font-size: 14px; }
  .stats { margin-top: 8px; display: grid; gap: 3px 12px;
           grid-template-columns: auto 1fr; font-size: 12px; color: var(--dim); }
  .stats b { color: var(--ink); font-weight: 500; }
  .spark { display: flex; gap: 2px; align-items: flex-end; height: 26px;
           margin-top: 9px; }
  .spark i { flex: 1; background: #2f4b60; border-radius: 1px 1px 0 0;
             min-height: 2px; position: relative; }
  .spark i:hover { background: var(--hot); }
  .why { display: inline-block; font-size: 11px; padding: 1px 6px;
         border-radius: 20px; border: 1px solid var(--line); color: var(--dim); }
  .why.time { border-color: #2d5136; color: #86c79a; }
  .why.idle { border-color: #5c4626; color: #d6a95e; }
  .why.err  { border-color: #5e2f31; color: #e08b8f; }

  /* list */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--dim); font-weight: 500; cursor: pointer; user-select: none;
       position: sticky; top: 0; background: var(--bg); }
  th[data-on] { color: var(--hot); }
  tbody tr:hover { background: #171b23; }
  td a { color: var(--hot); text-decoration: none; }
  .empty { color: var(--dim); padding: 40px 0; }
</style>

<header>
  <h1>jy-crpg-bench <small>20 minutes in 金庸群俠傳, one run per model</small></h1>
  <span id="live"></span>
</header>

<div class="bar">
  <div class="seg" id="view">
    <button data-v="grid" aria-pressed="true">grid</button>
    <button data-v="list" aria-pressed="false">list</button>
  </div>
  <label for="sort">sort</label>
  <select id="sort"></select>
  <div class="seg"><button id="dir" aria-pressed="true">↓</button></div>
</div>

<main><div id="out" class="empty">loading…</div></main>

<script>
const COLS = [
  {k: "started",       t: "when",      f: r => new Date(r.started * 1000)
                                              .toLocaleString([], {month:"short", day:"numeric",
                                                hour:"2-digit", minute:"2-digit"})},
  {k: "actions",       t: "actions",   f: r => r.actions ?? 0},
  {k: "aps",           t: "act/s",     f: r => (r.aps ?? 0).toFixed(2)},
  {k: "ttfa",          t: "1st action",f: r => secs(r.ttfa)},
  {k: "gap_p50",       t: "gap p50",   f: r => secs(r.gap_p50)},
  {k: "gap_p95",       t: "gap p95",   f: r => secs(r.gap_p95)},
  {k: "distinct_keys", t: "key space", f: r => r.distinct_keys ?? 0},
  {k: "reads",         t: "screens",   f: r => r.reads ?? 0},
  {k: "played",        t: "played",    f: r => mmss(r.played ?? r.seconds)},
  {k: "reason",        t: "ended by",  f: r => why(r)},
];
const secs = v => v == null ? "-"
  : v < 10 ? Number(v.toFixed(1)) + "s" : Math.round(v) + "s";
const mmss = v => v == null ? "-"
  : Math.floor(v / 60) + ":" + String(Math.round(v % 60)).padStart(2, "0");

function why(r) {
  const cls = r.error ? "err" : r.reason === "time" ? "time" : "idle";
  const txt = r.error ? "error"
    : r.reason === "time" ? "full run"
    : r.reason === "idle" ? `idle ${mmss(r.idle_for)}` : (r.reason || "-");
  return `<span class="why ${cls}" title="${(r.error || "").replace(/"/g,"")}">${txt}</span>`;
}

// Same hue quantisation the game UI uses, so an agent keeps its colour here.
function hue(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${(h % 12) * 30} 62% ${h >> 8 & 1 ? 72 : 58}%)`;
}

function spark(keys) {
  const e = Object.entries(keys || {});
  if (!e.length) return "";
  const top = e.slice(0, 14), max = Math.max(...top.map(x => x[1]));
  return `<div class="spark">` + top.map(([k, n]) =>
    `<i style="height:${Math.max(8, n / max * 100)}%" title="${k}: ${n}"></i>`
  ).join("") + `</div>`;
}

let runs = [], view = "grid", sort = "started", desc = true;

function render() {
  const out = document.getElementById("out");
  if (!runs.length) { out.className = "empty"; out.textContent = "no runs yet"; return; }
  const col = COLS.find(c => c.k === sort);
  const rows = [...runs].sort((a, b) => {
    const x = a[sort], y = b[sort];
    const bad = v => v == null || v === "";
    if (bad(x) && bad(y)) return 0;
    if (bad(x)) return 1;                       // missing always sinks
    if (bad(y)) return -1;
    const d = typeof x === "string" ? String(x).localeCompare(String(y)) : x - y;
    return desc ? -d : d;
  });

  if (view === "list") {
    out.className = "";
    out.innerHTML = `<table><thead><tr><th data-k="agent">agent</th>` +
      COLS.map(c => `<th data-k="${c.k}" ${c.k === sort ? "data-on" : ""}>${c.t}` +
                    `${c.k === sort ? (desc ? " ↓" : " ↑") : ""}</th>`).join("") +
      `<th>video</th></tr></thead><tbody>` +
      rows.map(r => `<tr><td style="color:${hue(r.agent)}">${r.agent}</td>` +
        COLS.map(c => `<td>${c.f(r)}</td>`).join("") +
        `<td>${r.video_url ? `<a href="${r.video_url}">mp4</a>` : "-"}</td></tr>`
      ).join("") + `</tbody></table>`;
    out.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if (k === sort) desc = !desc; else { sort = k; desc = true; }
      document.getElementById("sort").value = sort;
      document.getElementById("dir").textContent = desc ? "↓" : "↑";
      render();
    });
    return;
  }

  out.className = "grid";
  out.innerHTML = rows.map(r => `
    <div class="card">
      ${r.video_url
        ? `<video src="${r.video_url}" controls preload="metadata" playsinline></video>`
        : `<div style="aspect-ratio:320/232;display:grid;place-items:center;
             color:var(--dim);background:#000">no video</div>`}
      <div class="meta">
        <div class="who" style="color:${hue(r.agent)}">${r.agent}</div>
        <div class="stats">
          <span>actions</span><b>${r.actions ?? 0} · ${(r.aps ?? 0).toFixed(2)}/s</b>
          <span>1st action</span><b>${secs(r.ttfa)}</b>
          <span>think p50 / p95</span><b>${secs(r.gap_p50)} / ${secs(r.gap_p95)}</b>
          <span>keys used</span><b>${r.distinct_keys ?? 0}</b>
          <span>played</span><b>${mmss(r.played ?? r.seconds)} ${why(r)}</b>
        </div>
        ${spark(r.keys)}
      </div>
    </div>`).join("");
}

async function poll() {
  try {
    const [c, l] = await Promise.all([
      fetch("/api/catalog").then(r => r.json()),
      fetch("/api/sessions").then(r => r.json()).catch(() => ({running: []})),
    ]);
    runs = c.runs || [];
    const n = (l.running || []).length;
    document.getElementById("live").textContent =
      (n ? `${n} running · ` : "") + `${runs.length} finished`;
    render();
  } catch (e) { /* keep whatever is on screen */ }
}

const sel = document.getElementById("sort");
sel.innerHTML = [{k: "agent", t: "agent"}, ...COLS]
  .map(c => `<option value="${c.k}">${c.t}</option>`).join("");
sel.value = sort;
sel.onchange = () => { sort = sel.value; render(); };
document.getElementById("dir").onclick = e => {
  desc = !desc; e.target.textContent = desc ? "↓" : "↑"; render();
};
document.getElementById("view").onclick = e => {
  if (!e.target.dataset.v) return;
  view = e.target.dataset.v;
  [...e.currentTarget.children].forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.v === view)));
  render();
};
poll();
setInterval(poll, 10000);
</script>
